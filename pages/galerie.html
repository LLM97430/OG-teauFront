<!-- Modal Edition-->
<div class="modal fade" id="EditionPhotoModal" tabindex="-1" aria-labelledby="EditionPhotoModal" aria-hidden="true">
<div class="modal-dialog">
   <div class="modal-content">
   <div class="modal-header">
      <h2 class="modal-title fs-5" id="EditionPhotoModal">Edition de photo</h1>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
   </div>
   <div class="modal-body">
      Formulaire d'édition de photo
         <form>
      <div class="form-group">
         <label for="NamePhotoInput">Titre</label>
         <input type="text" class="form-control" id="NamePhotoInput" placeholder="Tarte au citron meringuée">
      </div>
      <div class="form-group mb-2">
         <label for="ImageInput">Choisir une photo</label>
         <input type="file" class="form-control" id="ImageInput" placeholder="">
      </div>
      <button type="button" class="btn btn-primary">Enregistrer</button>
   </form>

   </div>
   </div>
</div>
</div>

<!-- Modal Suppression-->
<div class="modal fade" id="SuppressionPhotoModal" tabindex="-1" aria-labelledby="SuppressionPhotoModal" aria-hidden="true">
<div class="modal-dialog">
   <div class="modal-content">
   <div class="modal-header">
      <h2 class="modal-title fs-5" id="SuppressionPhotoModal">Êtes-vous sûr de vouloir supprimer cette photo ?</h1>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
   </div>
   <div class="modal-body">
      Formulaire d'édition de photo
         <form>
      <div class="form-group">
         <label for="NamePhotoInput">Cacao</label>
            <img src="/images/cacao.jpg" alt="Cacao" class="rounded w-100">
      </div>
      <button type="button" class="btn btn-danger">Supprimer</button>
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
   </form>

   </div>
   </div>
</div>
