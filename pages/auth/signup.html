<div class="hero-scene-galerie text-center h-100">
   <div class="hero-scene-content text-center p-5">
      <p>Le chef pâtissier vous invite</p>
      <h1>Inscription</h1>
      </div>
</div>

<div class="container">
   <form>
      <div class="form-group">
         <label for="FirstnameInput">Votre prénom</label>
         <input type="text" class="form-control" id="FirstnameInput" placeholder="Votre prénom">
      </div>
      <div class="form-group">
         <label for="NameInput">Votre nom</label>
         <input type="text" class="form-control" id="NameInput" placeholder="Votre nom">
      </div>

      <div class="form-group">
         <label for="exampleInputEmail1">Votre adresse e-mail</label>
         <input type="email" class="form-control" id="EmailInput" placeholder="e@mail.com">
      </div>
      <div class="form-group mb-2">
         <label for="PasswordInput">Votre mot de passe</label>
         <input type="password" class="form-control" id="PasswordInput" placeholder="Mot de passe">
      </div>
      <div class="form-group mb-2">
         <label for="ValidatePasswordInput">Répétez votre mot de passe</label>
         <input type="password" class="form-control" id="ValidatePasswordInput" placeholder="Mot de passe">
      </div>
      <button type="submit" class="btn btn-primary">Vous inscrire</button>
   </form>
   <div class="text-center">
      <a href="/login">Vous avez déjà un compte ? Connectez-vous ici !</a>
   </div>
</div>
